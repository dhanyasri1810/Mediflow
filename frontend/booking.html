
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediFlow - Book Appointment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MediFlow</h1>
        <p>Your healthcare, organized.</p>
    </header>

    <main>
        <section class="hero">
            <h2>Book an Appointment</h2>

            <form id="bookingForm">
                <label for="patient_name">Patient Name</label>
                <input type="text" id="patient_name" required>

                <label for="department">Department</label>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="General Medicine">General Medicine</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Pediatrics">Pediatrics</option>
                </select>

                <label for="appointment_date">Appointment Date</label>
                <input type="date" id="appointment_date" required>

                <label for="reason">Reason for Visit</label>
                <textarea id="reason" required></textarea>

                <button type="submit">Book Appointment</button>
            </form>

            <p id="message"></p>
            <p><a href="index.html">Back to Home</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("bookingForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            message.textContent = "Submitting appointment...";

            const appointment = {
                patient_name: document.getElementById("patient_name").value.trim(),
                department: document.getElementById("department").value,
                appointment_date: document.getElementById("appointment_date").value,
                reason: document.getElementById("reason").value.trim()
            };

            try {
                const response = await fetch("http://127.0.0.1:5000/appointments", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(appointment)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Booking failed");
                }

                message.textContent = "Appointment booked successfully! ID: " + result.appointment_id;
                form.reset();
            } catch (error) {
                message.textContent = "Could not connect to the backend. Please start the Python server and try again.";
            }
        });
    </script>
</body>
</html>
